<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="900" height="430" rx="10" fill="#ffffff"/>
<text x="450" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1f2328">HedgedRequestKit&#160;&#8212;&#160;one&#160;request,&#160;first&#160;success&#160;wins</text>
<rect x="30" y="70" width="200" height="60" rx="8" fill="#ddf4ff" stroke="#0969da"/>
<text x="130" y="96" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328">[HedgeAttempt]</text>
<text x="130" y="116" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">primary,&#160;backup,&#160;...&#160;(e.g.&#160;providers)</text>
<line x1="230" y1="100" x2="330" y2="100" stroke="#57606a" stroke-width="2"/>
<polygon points="330,95 340,100 330,105" fill="#57606a"/>
<rect x="340" y="60" width="260" height="190" rx="8" fill="#fff8c5" stroke="#9a6700"/>
<text x="470" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1f2328">actor&#160;HedgedExecutor</text>
<text x="360" y="110" font-family="Menlo,monospace" font-size="11" fill="#1f2328">t=0&#160;&#160;&#160;&#160;launch&#160;primary</text>
<text x="360" y="130" font-family="Menlo,monospace" font-size="11" fill="#1f2328">t=delay&#160;still&#160;running?</text>
<text x="360" y="148" font-family="Menlo,monospace" font-size="11" fill="#1f2328">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;budget.trySpend()&#160;&#8594;&#160;hedge</text>
<text x="360" y="168" font-family="Menlo,monospace" font-size="11" fill="#1f2328">error?&#160;&#160;failover&#160;now&#160;(no&#160;budget)</text>
<text x="360" y="186" font-family="Menlo,monospace" font-size="11" fill="#1f2328">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;and&#160;restart&#160;the&#160;hedge&#160;clock</text>
<text x="360" y="206" font-family="Menlo,monospace" font-size="11" fill="#1f2328">success&#160;cancel&#160;the&#160;rest,&#160;record</text>
<text x="360" y="224" font-family="Menlo,monospace" font-size="11" fill="#1f2328">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;latency&#160;into&#160;the&#160;window</text>
<line x1="600" y1="100" x2="680" y2="100" stroke="#57606a" stroke-width="2"/>
<polygon points="680,95 690,100 680,105" fill="#57606a"/>
<rect x="690" y="70" width="180" height="60" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
<text x="780" y="96" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328">HedgeOutcome</text>
<text x="780" y="116" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">winner,&#160;reason,&#160;launched</text>
<rect x="690" y="160" width="180" height="60" rx="8" fill="#ffebe9" stroke="#cf222e"/>
<text x="780" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328">HedgeError</text>
<text x="780" y="206" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">.allFailed(failures,&#160;budgetDenied)</text>
<line x1="600" y1="190" x2="680" y2="190" stroke="#57606a" stroke-width="2"/>
<polygon points="680,185 690,190 680,195" fill="#57606a"/>
<rect x="60" y="300" width="220" height="90" rx="8" fill="#f6f8fa" stroke="#57606a"/>
<text x="170" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1f2328">HedgeDelay</text>
<text x="170" y="348" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">.fixed&#160;or&#160;.percentile(p95)</text>
<text x="170" y="366" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">over&#160;a&#160;bounded&#160;LatencyWindow</text>
<rect x="340" y="300" width="220" height="90" rx="8" fill="#f6f8fa" stroke="#57606a"/>
<text x="450" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1f2328">HedgeBudget</text>
<text x="450" y="348" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">token&#160;bucket:&#160;+ratio&#160;per&#160;request,</text>
<text x="450" y="366" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">&#8722;1&#160;per&#160;hedge,&#160;capped&#160;at&#160;burst</text>
<rect x="620" y="300" width="220" height="90" rx="8" fill="#f6f8fa" stroke="#57606a"/>
<text x="730" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1f2328">HedgeSleeper</text>
<text x="730" y="348" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">protocol;&#160;TaskSleeper&#160;in&#160;production,</text>
<text x="730" y="366" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">scripted&#160;sleepers&#160;in&#160;tests</text>
<line x1="170" y1="300" x2="400" y2="250" stroke="#8c959f" stroke-dasharray="4 3"/>
<line x1="450" y1="300" x2="470" y2="250" stroke="#8c959f" stroke-dasharray="4 3"/>
<line x1="730" y1="300" x2="560" y2="250" stroke="#8c959f" stroke-dasharray="4 3"/>
</svg>
